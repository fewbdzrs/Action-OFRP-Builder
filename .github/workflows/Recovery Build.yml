name: Download OrangeFox Source

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'

jobs:
  download:
    runs-on: ubuntu-24.04
    steps:

    - name: Free disk space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Show disk before
      run: df -h

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+rx ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.name "builder"
        git config --global user.email "builder@local"
        git config --global http.postBuffer 524288000
        git config --global core.compression 0

    - name: Init manifest
      run: |
        mkdir -p ~/fox && cd ~/fox
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b twrp-${{ github.event.inputs.MANIFEST_BRANCH }} \
          --depth=1 --git-lfs

    - name: Sync sources
      run: |
        cd ~/fox
        repo sync -j4 --force-sync --no-clone-bundle --no-tags

    - name: Show disk after
      run: |
        df -h
        du -sh ~/fox

    - name: Cleanup git history to shrink size
      run: |
        cd ~/fox
        # 删除所有 .git 目录，只保留工作文件
        find . -name ".git" -type d -prune -exec rm -rf {} +
        find . -name ".repo" -type d -prune -exec rm -rf {} +
        du -sh ~/fox

    - name: Pack with pigz
      run: |
        sudo apt-get install -y pigz
        cd ~
        tar --use-compress-program="pigz -6" -cf fox_source.tar.gz fox/
        ls -lh fox_source.tar.gz

    - name: Split into 1.9GB parts
      run: |
        cd ~
        split -b 1900M fox_source.tar.gz fox_part_
        ls -lh fox_part_*

    - name: Upload parts
      uses: actions/upload-artifact@v4
      with:
        name: fox-source
        path: |
          ~/fox_part_*
        retention-days: 7
